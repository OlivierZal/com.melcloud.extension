updates:
  # Both ecosystems share the `build(deps)` type: it keeps every bump under
  # one `git log --grep` and leaves `ci` to mean hand-written CI changes.
  # Pinned rather than left to Dependabot, which otherwise infers prefix and
  # capitalization from each repo's history and lands a different style per
  # repo.
  - commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    directory: /
    groups:
      actions:
        patterns:
          - '*'
    # One version covers both delivery channels, and the pin check
    # enforces it. Left to Dependabot, the workflow refs would move in
    # their own PR while the npm pin stayed put: each PR would then
    # fail the check and neither could merge alone. The npm bump
    # drives, and the dependabot-fix run carries the refs along.
    ignore:
      - dependency-name: OlivierZal/configs
    package-ecosystem: github-actions
    schedule:
      interval: weekly
  - commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    cooldown:
      default-days: 7
    directory: /
    groups:
      eslint:
        patterns:
          - '@eslint/*'
          - '@html-eslint/*'
          - '@stylistic/*'
          - eslint
          - eslint-*
          - typescript-eslint
      minor-and-patch:
        exclude-patterns:
          - '@eslint/*'
          - '@html-eslint/*'
          - '@stylistic/*'
          - '@vitest/*'
          - eslint
          - eslint-*
          - typescript-eslint
          - vitest
        update-types:
          - minor
          - patch
      vitest:
        patterns:
          - '@vitest/*'
          - vitest
    package-ecosystem: npm
    schedule:
      interval: weekly
version: 2
